site_name: MonsterOS Documentation
site_description: Architecture, technology and build log for the MonsterOS field service MVP
# Set to your Pages URL once known, e.g. https://<user-or-org>.github.io/<repo>/
site_url: "https://phanin.github.io/monsteros-docs/"
repo_url: "https://github.com/phanin/monsteros-docs"
docs_dir: docs
exclude_docs: |
  README.md
  REQUIREMENTS_CONFIRMATION.md
  DAY2_APPLY.md
  DAY3_NOTES.md
  DAY4_NOTES.md
  DAY5_NOTES.md
  DAY6_NOTES.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Overview:
      - Architecture: architecture.md
      - Technology and libraries: technology.md
      - Data model: data-model.md
      - Roles and permissions: permissions.md
      - User management: user-management.md
      - Data dictionary: data-dictionary.md
      - Customers, contacts and sites: customers.md
      - Security baseline: security-baseline.md
  - Guides:
      - Local setup: setup.md
      - Conventions: conventions.md
      - Deployment: deployment.md
      - Troubleshooting: troubleshooting.md
      - Milestone 1 acceptance: m1-acceptance.md
  - Build log:
      - Overview: daily/index.md
      - Day 1 - Repo and Docker: daily/day-01.md
      - Day 2 - Company and User: daily/day-02.md
      - Day 3 - Auth and roles: daily/day-03.md
      - Day 4 - User management and CI: daily/day-04.md
      - Day 5 - Deployment and docs: daily/day-05.md
      - Day 6 - Customers, contacts, sites: daily/day-06.md
  - Roadmap: roadmap.md
